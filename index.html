<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Deutsch-Meister</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/svg+xml" href="icons/icon.svg">
    <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192x192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="icons/icon-512x512.png">
    <link rel="apple-touch-icon" href="icons/icon-192x192.png">
    <meta name="theme-color" content="#3B6FE0">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="app" id="app">
    <!-- Боковая панель (десктоп) -->
    <div class="sidebar">
        <div class="sidebar-content">
            <button id="loginBtn" class="btn btn-login" style="margin-bottom: 10px;">🔐 Войти</button>
            <div id="userInfo" style="display: none; margin: 10px 0; padding: 8px; background: #E8F0FE; border-radius: 8px; text-align: center; font-size: 12px;"></div>
            <div style="margin: 15px 0 5px 0; font-size: 12px; color: #666; text-align: center; font-weight: bold;">📚 УРОВНИ</div>
            <div class="levels-container" id="levelsContainer">
                <button data-level="A1" class="btn btn-level active">A1</button>
                <button data-level="A2" class="btn btn-level">A2</button>
                <button data-level="B1" class="btn btn-level">B1</button>
                <button data-level="B2" class="btn btn-level">B2</button>
                <button data-level="C1" class="btn btn-level">C1</button>
            </div>
            <button id="shareBtnDesktop" class="btn share-btn" style="margin-top: 15px;" onclick="openShareModal()">🔗 ПОДЕЛИТЬСЯ</button>
            
            <!-- Админ-панель (только для администратора) -->
            <button id="adminPanelBtn" class="btn" style="background: #FF9800; color: white; border: none; display: none; margin-top: 10px;" onclick="openAdminPanel()">
                🛡️ АДМИН-ПАНЕЛЬ
            </button>
        </div>
    </div>

    <!-- Основная область -->
    <div class="main">
        <div class="top-bar">
            <div class="top-bar-left">
                <button class="hamburger-btn" id="hamburgerBtn">☰</button>
                <span id="modeIndicator" class="mode-indicator">Курс A1</span>
            </div>
            <span id="counter">Загрузка...</span>
        </div>
        <div class="content" id="content"></div>
    </div>
</div>

<!-- Мобильное меню -->
<div class="menu-overlay" id="menuOverlay"></div>
<div class="mobile-menu" id="mobileMenu">
    <div class="mobile-menu-header">
        <h3>📚 Deutsch-Meister</h3>
        <button class="close-menu-btn" id="closeMenuBtn">✕</button>
    </div>
    <div class="sidebar-content">
        <button id="loginBtnMobile" class="btn btn-login" style="margin-bottom: 10px;">🔐 Войти</button>
        <div id="userInfoMobile" style="display: none; margin: 10px 0; padding: 8px; background: #E8F0FE; border-radius: 8px; text-align: center; font-size: 12px;"></div>
        <div style="margin: 15px 0 5px 0; font-size: 12px; color: #666; text-align: center; font-weight: bold;">📚 УРОВНИ</div>
        <div class="levels-container" id="levelsContainerMobile">
            <button data-level="A1" class="btn btn-level active">A1</button>
            <button data-level="A2" class="btn btn-level">A2</button>
            <button data-level="B1" class="btn btn-level">B1</button>
            <button data-level="B2" class="btn btn-level">B2</button>
            <button data-level="C1" class="btn btn-level">C1</button>
        </div>
        <button id="shareBtnMobile" class="btn share-btn" style="margin-top: 15px;" onclick="openShareModal()">🔗 ПОДЕЛИТЬСЯ</button>
        
        <!-- Админ-панель (только для администратора) -->
        <button id="adminPanelBtnMobile" class="btn" style="background: #FF9800; color: white; border: none; display: none; margin-top: 10px;" onclick="openAdminPanel()">
            🛡️ АДМИН-ПАНЕЛЬ
        </button>
    </div>
</div>

<!-- ===== ПОДКЛЮЧЕНИЕ СКРИПТОВ ===== -->

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

<script>

<script src="js/config.js"></script>
<script src="js/utils.js"></script>
<script src="js/logger.js"></script>
<script src="js/containerManager.js"></script>
<script src="js/speak.js"></script>
<script src="js/grammarMode.js"></script>
<script src="js/vocabularyMode.js"></script>
<script src="js/practiceMode.js"></script>
<script src="js/quizMode.js"></script>
<script src="js/trainerMode.js"></script>
<script src="js/dictationMode.js"></script>
<script src="js/listeningMode.js"></script>
<script src="js/app.js"></script>
<script src="js/activityTracker.js"></script>
<script src="js/auth.js"></script>
<script src="js/adminModal.js"></script>
<script src="js/shareModal.js"></script>

<script>
// ===== МОБИЛЬНОЕ МЕНЮ =====
document.getElementById('hamburgerBtn').onclick = function() {
    document.getElementById('mobileMenu').classList.add('open');
    document.getElementById('menuOverlay').classList.add('show');
    document.body.style.overflow = 'hidden';
};
document.getElementById('closeMenuBtn').onclick = function() {
    document.getElementById('mobileMenu').classList.remove('open');
    document.getElementById('menuOverlay').classList.remove('show');
    document.body.style.overflow = '';
};
document.getElementById('menuOverlay').onclick = function() {
    document.getElementById('mobileMenu').classList.remove('open');
    document.getElementById('menuOverlay').classList.remove('show');
    document.body.style.overflow = '';
};

console.log('✅ Страница загружена');
</script>

</body>
</html>
